<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TAK Server MFA</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico" />
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/bootstrap-theme.min.css" />
  <script src="../jquery/jquery-3.5.0.js"></script>
  <style>
    body { font: 14px "Open Sans", Arial, sans-serif; background: #f7f7f9; }
    .panel { max-width: 420px; margin: 90px auto; background: #fff; padding: 32px;
             box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 6px; text-align: center; }
    h1 { font-size: 22px; margin-top: 0; color: #444; }
    .code-input { font-size: 28px; letter-spacing: 8px; text-align: center;
                  width: 220px; padding: 10px; margin: 16px 0; }
    .alert-success { background: #dff0d8; color: #3c763d; padding: 10px; border-radius: 4px; }
    .alert-danger  { background: #f2dede; color: #a94442; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Enter the 6-digit code from your TOTP app</h1>
    <form id="codeForm">
      <input class="code-input" id="code" maxlength="6" pattern="[0-9]{6}"
             inputmode="numeric" autocomplete="one-time-code" autofocus required />
      <br>
      <button class="btn btn-primary" type="submit">Verify</button>
    </form>
    <div id="result" style="margin-top:14px;"></div>
  </div>

  <script>
    var nextParam = new URLSearchParams(window.location.search).get('next') || '/Marti/';

    function setResult(html, kind) {
      $('#result').html('<div class="alert-' + (kind || 'danger') + '">' + html + '</div>');
    }

    $('#codeForm').submit(function(e) {
      e.preventDefault();
      var code = $('#code').val().trim();
      if (!/^\d{6}$/.test(code)) { setResult('Code must be 6 digits.'); return; }
      $.ajax({
        url: '/Marti/api/mfa/verify',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ code: code })
      }).done(function() {
        setResult('Verified. Redirecting...', 'success');
        setTimeout(function() { window.location.href = nextParam; }, 600);
      }).fail(function(xhr) {
        setResult('Wrong code (HTTP ' + xhr.status + ').');
        $('#code').val('').focus();
      });
    });
  </script>
</body>
</html>
